trigger:
 - development

stages:
  - stage: Build
    jobs:
      - job: Build
    displayName: Build the web application
    pool:
     name: AzDevopsagent1
     demands:
      - mvn

     steps:
     - task: Maven@4
       inputs:
       mavenPomFile: 'pom.xml'
       testResultsFiles: '**surefire-reports/TEST-*.xml'
       javaHomeOption: JDKVersion
       mavenVersionOption: Default
     
     - task: CopyFiles@2
       inputs:
       Contents: '**/target/*.jar'
       TargetFolder: '$(Build.ArtifactStagingDirectory)'

     - task: PublishPipelineArtifact@1
       inputs:
       targetPath: '$(Pipeline.Workspace)'
       publishLocation: 'pipeline'
       artifact: 'drop' 

  - stage: 'dev'
    displayName: 'Deploy to Dev environment'
    dependsOn: Build
    pool:
         name: AzDevopsagent1
         environment: dev
         strategy:
         runOnce:
           deploy:
             steps:
               - download: current
                 artifact: drop

  - stage: 'test'
    displayName: Deploy to Test environment'
    dependsOn: Dev
    jobs:
      - deployment: Deploy
        pool:
         name: AzDevopsagent1
         environment: test
        strategy:
         runOnce:
           deploy:
             steps:
               - download: current
                 artifact: drop

  - stage: 'staging'
    displayName: Deploy to staging environment'
    dependsOn: Test
    jobs:
      - deployment: Deploy
        pool:
         name: AzDevopsagent1
         environment: staging
        strategy:
         runOnce:
           deploy:
             steps:
               - download: current
                 artifact: drop
